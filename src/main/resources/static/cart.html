<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>سبد خرید</title>
    <style>
        body{font-family:Tahoma,sans-serif;background:#f7f7f7;margin:0}
        .wrap{max-width:980px;margin:24px auto;padding:16px}
        .card{background:#fff;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.06);padding:16px}
        h1{font-size:18px;margin:0 0 12px}
        table{width:100%;border-collapse:collapse;margin-top:8px}
        th,td{padding:10px;border-bottom:1px solid #eee;text-align:center;font-size:14px}
        .right{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
        .btn{border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
        .primary{background:#001937;color:#fff}
        .ghost{background:#eee}
        #err{display:none;color:#c62828;background:#ffebee;border:1px solid #ffcdd2;padding:8px 10px;border-radius:8px;margin-bottom:12px}
        .empty{padding:16px;text-align:center;color:#555}
        .recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:16px}
        .rec{background:#fff;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.05);overflow:hidden}
        .rec img{width:100%;height:140px;object-fit:cover;display:block}
        .rec .t{padding:8px;font-size:13px;color:#001937;min-height:40px}
        .rec .p{padding:0 8px 8px;color:#d62828;font-weight:700}
    </style>
</head>
<body>
<div id="siteHeader"></div>

<div class="wrap">
    <div class="card">
        <h1>سبد خرید</h1>
        <div id="err"></div>

        <div id="cartBox">
            <!-- جدول سبد با JS پر می‌شود -->
        </div>

        <div class="right">
            <button id="clearBtn" class="btn ghost">حذف همه</button>
            <button id="checkoutBtn" class="btn primary">تسویه و پرداخت</button>
        </div>
    </div>

    <div class="card" id="recsCard" style="display:none">
        <h1>پیشنهادها</h1>
        <div id="recs" class="recs"></div>
    </div>
</div>

<script src="/js/header.js"></script>
<script src="/js/cart.js"></script>
</body>
</html>
