<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>سبد خرید | Moon Style</title>
    <link rel="icon" type="image/png" href="/images/favicon.png"/>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <style>
        :root{--brand:#001937;--muted:#666;--card:#fff;--bg:#f7f7f7}
        *{box-sizing:border-box}
        body{font-family:Tahoma,sans-serif;background:var(--bg);margin:0}
        .wrap{max-width:1100px;margin:24px auto;padding:0 16px}
        .card{background:var(--card);border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.06);padding:16px}
        h1{font-size:18px;margin:0 0 12px;color:var(--brand)}

        .cart-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}
        .empty{padding:16px;color:var(--muted)}

        .row{display:grid;grid-template-columns:80px 1fr 90px 110px 40px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid #eee}
        .row img{width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid #eee}
        .title{font-size:14px}
        .price{font-weight:700;color:#d62828}
        .qty{display:flex;gap:6px;align-items:center}
        .qty input{width:52px;text-align:center;padding:6px;border:1px solid #ddd;border-radius:8px}
        .remove{background:#eee;border:0;border-radius:8px;cursor:pointer;padding:6px}
        .remove:hover{background:#e3e3e3}

        .summary{position:sticky;top:16px;background:var(--card);border-radius:12px;padding:16px;border:1px solid #eee}
        .sum-row{display:flex;justify-content:space-between;margin:8px 0}
        .btn{width:100%;padding:10px;border:0;border-radius:10px;cursor:pointer;margin-top:12px;font-weight:700}
        .btn.primary{background:var(--brand);color:#fff}

        /* پیشنهادها */
        #recoSection{display:none;margin-top:16px}
        #recoGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
        #recoGrid .product-card img{width:100%;height:220px;object-fit:cover;border-radius:6px;border:1px solid #eee}
        #recoGrid .product-name{font-size:13px;margin-top:6px}
        #recoGrid .product-price{font-weight:700;color:#d62828}

        @media (max-width:900px){
            .cart-grid{grid-template-columns:1fr}
            .summary{position:static}
            .row{grid-template-columns:70px 1fr 80px 100px 36px}
        }
    </style>
</head>
<body>
<!-- هدر داینامیک -->
<div id="siteHeader"></div>

<div class="wrap">
    <div class="card">
        <h1>سبد خرید</h1>

        <!-- خطاهای سمت کلاینت/سرور -->
        <div id="cartError"
             style="display:none;color:#c62828;background:#ffebee;border:1px solid #ffcdd2;padding:10px;border-radius:8px;margin:12px 0">
        </div>

        <div class="cart-grid">
            <!-- لیست اقلام سبد -->
            <section id="cartItems">
                <div id="emptyBox" class="empty" style="display:none">سبد شما خالی است.</div>
                <div id="itemsBox"></div>
            </section>

            <!-- جمع مبلغ و پرداخت -->
            <aside class="summary">
                <div class="sum-row">
                    <span>جمع جزء</span><strong id="subTotal">۰</strong>
                </div>
                <div class="sum-row">
                    <span>هزینه ارسال</span><strong id="shipping">۰</strong>
                </div>
                <div class="sum-row" style="border-top:1px dashed #ddd;padding-top:8px">
                    <span>مبلغ پرداختی</span><strong id="grandTotal">۰</strong>
                </div>
                <button id="btnCheckout" class="btn primary">ثبت سفارش</button>
            </aside>
        </div>

        <!-- پیشنهادها (SNNA) -->
        <section id="recoSection">
            <h3 style="margin:16px 0 8px;color:#001937;font-size:16px">پیشنهادها در رنج قیمت خرید شما</h3>
            <div id="recoGrid"></div>
        </section>
    </div>
</div>

<!-- اسکریپت‌ها -->
<script src="/js/header.js"></script>
<script src="/js/cart.js"></script>
</body>
</html>
