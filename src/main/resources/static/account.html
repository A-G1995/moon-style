<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>حساب کاربری</title>
    <style>
        body{font-family:Tahoma,sans-serif;background:#f7f7f7;margin:0}
        .wrap{max-width:740px;margin:24px auto;padding:16px}
        .card{background:#fff;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.06);padding:16px}
        h1{font-size:18px;margin:0 0 12px}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        .field{display:flex;flex-direction:column}
        label{font-size:12px;margin-bottom:6px;color:#555}
        input{padding:10px;border:1px solid #ddd;border-radius:8px}
        .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
        .btn{border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
        .primary{background:#001937;color:#fff}
        .ghost{background:#eee}
        #err{display:none;color:#c62828;background:#ffebee;border:1px solid #ffcdd2;padding:8px 10px;border-radius:8px;margin-bottom:12px}
    </style>
</head>
<body>
<div id="siteHeader"></div>

<div class="wrap">
    <div class="card">
        <h1>حساب کاربری</h1>
        <div id="err"></div>

        <div class="grid">
            <div class="field" data-field="fullName">
                <label for="fullName">نام کامل</label>
                <input id="fullName" type="text" disabled />
                <small data-error style="color:#c62828"></small>
            </div>
            <div class="field" data-field="email">
                <label for="email">ایمیل</label>
                <input id="email" type="email" disabled />
                <small data-error style="color:#c62828"></small>
            </div>
            <div class="field" data-field="phoneNumber">
                <label for="phoneNumber">شماره تلفن</label>
                <input id="phoneNumber" type="text" disabled inputmode="numeric" pattern="[0-9]*"/>
                <small data-error style="color:#c62828"></small>
            </div>
            <div class="field" data-field="nationalNumber">
                <label for="nationalNumber">کد ملی</label>
                <input id="nationalNumber" type="text" disabled inputmode="numeric" pattern="[0-9]*"/>
                <small data-error style="color:#c62828"></small>
            </div>
            <div class="field" data-field="birthDate">
                <label for="birthDate">تاریخ تولد (yyyy-MM-dd)</label>
                <input id="birthDate" type="text" disabled placeholder="1998-06-21"/>
                <small data-error style="color:#c62828"></small>
            </div>
        </div>

        <div class="row">
            <button id="editBtn" class="btn ghost">ویرایش</button>
            <button id="cancelBtn" class="btn ghost" style="display:none">انصراف</button>
            <button id="saveBtn" class="btn primary" style="display:none">ذخیره</button>
        </div>
    </div>
</div>

<script src="/js/header.js"></script>
<script src="/js/account.js"></script>
</body>
</html>
