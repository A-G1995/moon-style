<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>جزئیات محصول | Moon Style</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        body{font-family:Tahoma,sans-serif;background:#f7f7f7;margin:0}
        .container{max-width:980px;margin:24px auto;padding:16px;display:grid;grid-template-columns:360px 1fr 320px;gap:16px}
        .card{background:#fff;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.06);padding:16px}
        .left{display:flex;align-items:center;justify-content:center;height:420px}
        .product-image{max-width:100%;max-height:100%;object-fit:contain}
        .product-name{font-weight:700;font-size:20px;margin-bottom:12px;color:#001937}
        .price{font-size:22px;font-weight:700;color:#d62828;margin:16px 0}
        .attrs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        .attr label{font-size:12px;color:#555;margin-bottom:6px;display:block}
        .attr .val{font-size:14px}
        .seller .row{display:flex;justify-content:space-between;margin:8px 0}
        .seller button{width:100%;background:#001937;color:#fff;border:0;border-radius:8px;padding:12px;cursor:pointer}
        #err{display:none;color:#c62828;background:#ffebee;border:1px solid #ffcdd2;padding:8px 10px;border-radius:8px;margin-bottom:12px;grid-column:1/-1}
        #loading{padding:12px;color:#555}
        .badgelike{display:inline-block;background:#eef2ff;color:#001937;border-radius:999px;padding:3px 10px;font-size:12px;margin-inline-start:6px}
        @media (max-width: 980px){ .container{grid-template-columns:1fr; } .left{height:340px} }
    </style>
</head>
<body>
<div id="siteHeader"></div>

<div class="container">
    <div id="err"></div>

    <!-- تصویر -->
    <div class="card left">
        <img class="product-image" src="/images/placeholder.jpg" alt="" onerror="this.onerror=null;this.src='/images/placeholder.jpg'"/>
    </div>

    <!-- اطلاعات -->
    <div class="card middle">
        <div class="product-name">...</div>
        <div class="price">...</div>

        <div class="attrs">
            <div class="attr">
                <label>رنگ</label>
                <div class="val color">-</div>
            </div>
            <div class="attr">
                <label>سایز</label>
                <div class="val size">-</div>
            </div>
            <div class="attr">
                <label>دسته‌بندی</label>
                <div class="val category">-</div>
            </div>
            <div class="attr">
                <label>موجودی</label>
                <div class="val stock">-</div>
            </div>
        </div>
    </div>

    <!-- فروشنده / خرید -->
    <div class="card seller">
        <div class="row"><span>فروشنده</span><span class="badgelike">مون استایل</span></div>
        <div class="row"><span>رضایت خریداران</span><span>۸۰٪</span></div>
        <div class="price" id="priceBox">...</div>
        <button id="addBtn">افزودن به سبد خرید</button>
    </div>
</div>

<script src="/js/header.js"></script>
<script src="/js/product.js"></script>
</body>
</html>
