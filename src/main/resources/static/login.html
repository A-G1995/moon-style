<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>ورود | Moon Style</title>
    <link rel="icon" type="image/png" href="/images/favicon.png"/>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <style>
        :root{--bg:#f7f7f7;--card:#fff;--brand:#001937;--accent:#ff5a5f;--muted:#666}
        *{box-sizing:border-box}
        body{font-family:Tahoma, sans-serif;background:var(--bg);margin:0}
        .wrap{max-width:420px;margin:36px auto;padding:0 16px}
        .card{background:var(--card);border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.06);padding:20px}
        h1{margin:0 0 12px;color:var(--brand);font-size:20px}
        p.sub{margin:0 0 16px;color:var(--muted);font-size:13px}

        .field{margin:10px 0}
        .field label{display:block;font-size:12px;color:#555;margin-bottom:6px}
        .field input{
            width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;background:#fff;font-size:14px
        }
        .btn{width:100%;padding:10px;margin-top:12px;border:0;border-radius:10px;cursor:pointer;font-weight:700}
        .btn.primary{background:var(--brand);color:#fff}
        .hint{font-size:12px;color:#777;margin-top:8px;text-align:center}
        .hint a{color:var(--brand);text-decoration:none}
        .hint a:hover{text-decoration:underline}

        #loginError{
            display:none;color:#c62828;background:#ffebee;border:1px solid #ffcdd2;
            padding:10px;border-radius:8px;margin-bottom:12px;font-size:13px
        }
    </style>
</head>
<body>
<div id="siteHeader"></div>

<div class="wrap">
    <div class="card">
        <h1>ورود</h1>
        <p class="sub">برای ادامه لطفاً ایمیل و رمز عبور را وارد کنید.</p>

        <div id="loginError"></div>

        <form id="loginForm" novalidate>
            <div class="field">
                <label for="email">ایمیل</label>
                <input id="email" name="email" type="email" placeholder="example@mail.com" autocomplete="username" required/>
            </div>

            <div class="field">
                <label for="password">رمز عبور</label>
                <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required/>
            </div>

            <button class="btn primary" type="submit">ورود</button>
        </form>

        <div class="hint">
            حساب کاربری ندارید؟
            <a href="/signup.html">ثبت‌نام</a>
        </div>
    </div>
</div>

<script src="/js/header.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
